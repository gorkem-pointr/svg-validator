server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Force browsers to revalidate every asset via ETag on each request.
  # Small files + no hashed filenames = cheaper than stale-bug debugging.
  add_header Cache-Control "no-cache" always;
  etag on;

  location / {
    try_files $uri $uri/ =404;
  }
}
